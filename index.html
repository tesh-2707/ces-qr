<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>UL CES Sign-up</title>
<noscript><meta http-equiv="refresh" content="0;url=https://ulwolves.ie/society/entrepreneurship"></noscript>
<style>body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#0f1b2d;color:#fff;text-align:center}h1{font-size:1.6rem;margin:0 0 8px;letter-spacing:.02em}p{margin:0;color:#b8c4d6}a{color:#fff}</style>
</head>
<body>
<main><h1>UL CES Sign-up</h1><p>Consulting &amp; Entrepreneurship Society</p><p style="margin-top:16px;font-size:.85rem">Opening sign-up&hellip; <a href="https://ulwolves.ie/society/entrepreneurship">tap here</a> if nothing happens.</p></main>
<script>
(function () {
  var DEST = "https://ulwolves.ie/society/entrepreneurship";
  var API = "https://abacus.jasoncameron.dev/hit/ces3742463efead9fe7/";
  // Optional ?s=poster-library to tag which QR/placement was scanned
  var src = (new URLSearchParams(location.search).get("s") || "").toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 30);
  var day = new Date().toISOString().slice(0, 10);
  var keys = ["scans-total", "scans-" + day];
  if (src) keys.push("src-" + src);
  var go = function () { location.replace(DEST); };
  var pending = keys.map(function (k) { return fetch(API + k, { keepalive: true, cache: "no-store" }).catch(function () {}); });
  Promise.race([Promise.all(pending), new Promise(function (r) { setTimeout(r, 1500); })]).then(go, go);
})();
</script>
</body>
</html>
